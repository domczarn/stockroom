name = "stockroom"
main = "dist/server/index.js"
compatibility_date = "2025-11-01"
workers_dev = false
# Keep variables added in the Cloudflare dashboard (MS_CLIENT_ID, FORWARD_DOMAIN...) when a push deploys.
keep_vars = true

# Gmail OAuth is pinned to this origin.
routes = [{ pattern = "stockroom.bookednpaid.com", custom_domain = true }]

[triggers]
# Every minute: one Gmail mailbox. Every 10 minutes: price index, alerts, weekly reports. Separate runs, separate budgets.
crons = ["* * * * *", "*/10 * * * *"]

# Scripts, styles, fonts and images live under /s/<version>/ and are served by Cloudflare directly, cached for a year.
# Everything else (pages, API, old unversioned paths) runs through the Worker.
[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = ["/*", "!/s/*"]

# Per-account limit on saves and other changes (60 a minute), counted at the edge instead of in D1.
[[ratelimits]]
name = "SAVE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[observability]
enabled = true

[vars]
# Zero Trust > Settings > Custom pages shows the team domain; the AUD tag is on the Access application.
ACCESS_TEAM_DOMAIN = "bookedandpaid.cloudflareaccess.com"
ACCESS_AUD = "992b39270c0e1a31448496e68a7df498d68101686c72c1beba5fdce9496e3a56,12e1cf810afb317f89cdfabac7152113108fb7c4b473df5d9b993f9ac38d6925"
# Cloudflare Turnstile site key (public). The matching TURNSTILE_SECRET is a Worker secret.
TURNSTILE_SITE_KEY = "0x4AAAAAAGMGzv9zsukDxpO7"
# Stockroom mail comes from its own subdomain (verified in Resend), not the main bookednpaid.com inbox.
AUTH_EMAIL_FROM = "pip@stockroom.bookednpaid.com"

[[d1_databases]]
binding = "DB"
database_name = "stockroom"
database_id = "2b76c030-e954-4785-b556-9846fe90f42c"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "stockroom-photos"

# Secrets (wrangler secret put): STOCKROOM_SERVICE_KEY, GOOGLE_GMAIL_CLIENT_ID, GOOGLE_GMAIL_CLIENT_SECRET

[ai]
binding = "AI"


# Photo studio background removal (Cloudflare Images, segment=foreground)
[images]
binding = "IMAGES"
