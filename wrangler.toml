name = "stockroom"
main = "dist/server/index.js"
compatibility_date = "2025-11-01"
workers_dev = true

# Gmail OAuth is pinned to this origin.
routes = [{ pattern = "stockroom.bookednpaid.com", custom_domain = true }]

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true

[vars]
# Zero Trust > Settings > Custom pages shows the team domain; the AUD tag is on the Access application.
ACCESS_TEAM_DOMAIN = "bookedandpaid.cloudflareaccess.com"
ACCESS_AUD = "992b39270c0e1a31448496e68a7df498d68101686c72c1beba5fdce9496e3a56,12e1cf810afb317f89cdfabac7152113108fb7c4b473df5d9b993f9ac38d6925"

[[d1_databases]]
binding = "DB"
database_name = "stockroom"
database_id = "2b76c030-e954-4785-b556-9846fe90f42c"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "stockroom-photos"

# Secrets (wrangler secret put): STOCKROOM_SERVICE_KEY, GOOGLE_GMAIL_CLIENT_ID, GOOGLE_GMAIL_CLIENT_SECRET

[ai]
binding = "AI"

